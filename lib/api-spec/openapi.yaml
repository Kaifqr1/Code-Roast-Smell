openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: roast
    description: Code roasting operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /roast:
    post:
      operationId: roastCode
      tags: [roast]
      summary: Roast a code snippet
      description: Sends a code snippet to an LLM and returns a witty roast, smell rating, improvement tip, and encouragement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoastInput"
      responses:
        "200":
          description: Roast result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastError"
        "500":
          description: Server or LLM error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoastInput:
      type: object
      properties:
        code:
          type: string
          description: The code snippet to roast
          minLength: 1
        language:
          type: string
          description: Programming language of the snippet (e.g. JavaScript, Python)
      required:
        - code
        - language
    RoastResult:
      type: object
      properties:
        roast:
          type: string
          description: Witty roast of the code (1-3 sentences)
        smellRating:
          type: string
          description: "Smell rating: Fresh Bread | Slightly Burnt | Getting Toasty | Spaghetti | Burnt Toast | Radioactive Waste"
        smellEmoji:
          type: string
          description: Emoji matching the smell rating
        improvementTip:
          type: string
          description: One specific, genuine improvement suggestion
        encouragement:
          type: string
          description: Short encouraging closing line
      required:
        - roast
        - smellRating
        - smellEmoji
        - improvementTip
        - encouragement
    RoastError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
