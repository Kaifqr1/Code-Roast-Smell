kind = "web"
previewPath = "/"
title = "Code Roast & Smell Test"
version = "1.0.0"
id = "artifacts/code-roast"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20176

[services.development]
run = "pnpm --filter @workspace/code-roast run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/code-roast", "run", "build" ]
serve = "static"
publicDir = "artifacts/code-roast/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20176"
BASE_PATH = "/"
