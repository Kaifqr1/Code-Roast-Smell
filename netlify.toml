[build]
  command   = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/code-roast run build"
  publish   = "artifacts/code-roast/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route /api/roast → Netlify Function
[[redirects]]
  from   = "/api/roast"
  to     = "/.netlify/functions/roast"
  status = 200

# SPA fallback — must be last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
